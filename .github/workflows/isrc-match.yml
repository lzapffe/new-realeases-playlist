# =============================================================================
# GitHub Actions workflow: match the unsure artists to Deezer by ISRC.
# Runs matching/isrc_match.R when you start it by hand, and saves the report
# (matching/isrc_report.csv) and, if you tick "save matches", state/artists.csv.
# Goes in .github/workflows/isrc-match.yml in the new-releases repository.
# Uses NO Spotify requests (only the saved playlist copies and Deezer).
# =============================================================================

name: "Artist matching: ISRC"

# Only started by hand, with the "Run workflow" button.
on:
  workflow_dispatch:
    inputs:
      save_matches:
        description: "Save the matches in state/artists.csv (leave unticked for a report only)"
        type: boolean
        default: false

# "contents: write" lets the last step commit the results.
permissions:
  contents: write

# Shares its queue with the daily new-releases workflow, because both change
# state/artists.csv. They never run at the same time.
concurrency:
  group: spotify-new-releases
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Copy the repository (the saved playlist copies and artists.csv).
      - uses: actions/checkout@v5

      # Install R and the R packages (cached for later runs).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::dplyr
            any::purrr
            any::tibble

      - name: Match artists by ISRC
        env:
          SAVE_MATCHES: ${{ inputs.save_matches }}
        run: Rscript matching/isrc_match.R

      # Save the report, and artists.csv if the matches were saved.
      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          [ -f matching/isrc_report.csv ] && git add matching/isrc_report.csv
          git add state/artists.csv
          git diff --cached --quiet || git commit -m "Artist matching: ISRC"
          git pull --rebase
          git push
